apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-demo
  template:
    metadata:
      labels:
        app: fastapi-demo
    spec:
      containers:
      - name: fastapi-demo
        image: zifeiyu2020/fastapi-demo:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-demo
  namespace: default
spec:
  type: NodePort
  selector:
    app: fastapi-demo
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
